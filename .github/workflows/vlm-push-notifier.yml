# VLM push notifier: a small, push-triggered GitHub-native notification.
# Every push to main produces an issue assigned to the repository owner.
# No experiment, checkout, third-party action, or external notification secret.
name: VLM push notifier

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: vlm-push-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.sha }}
      NOTIFY_USER: floomeer83felix-source
    steps:
      - name: Summarize push and notify owner via GitHub Issue
        shell: bash
        run: |
          set -euo pipefail

          # Compare covers all commits in a multi-commit push.
          # A first push or a force push may not have a comparable before SHA.
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            response="$(gh api "repos/$REPOSITORY/commits/$AFTER_SHA")"
          else
            response="$(gh api "repos/$REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA" 2>/dev/null || gh api "repos/$REPOSITORY/commits/$AFTER_SHA")"
          fi

          # File names are treated as DATA only, never executed as commands.
          # Truncate display to avoid very large notifications.
          mapfile -t paths < <(jq -r '.files[]?.filename | select(type == "string")' <<< "$response" | head -n 40)
          total_files="$(jq -r '(.files // []) | length' <<< "$response")"

          result_push=false
          for path in "${paths[@]}"; do
            case "$path" in
              docs/codex-results.md|docs/codex-artifacts/*)
                result_push=true
                ;;
            esac
          done

          if [[ "$result_push" == true ]]; then
            kind="Codex research results"
            next_step="Review docs/codex-results.md and the new artifact, then ask ChatGPT to assess the result and update docs/next-steps.md."
          else
            kind="Repository update"
            next_step="Review the changed files; no model experiment or research review was automatically executed."
          fi

          short_sha="${AFTER_SHA:0:7}"
          title="[VLM push] $kind — $short_sha"
          changed=""
          for path in "${paths[@]}"; do
            # Escape markdown code delimiters; the paths remain untrusted text.
            changed+="- ${path}"
          done
          if [[ -z "$changed" ]]; then
            changed="- No changed filenames returned by the GitHub API."$'\n'
          fi
          if (( total_files > 40 )); then
            changed+="- … and $(( total_files - 40 )) more files."$'\n'
          fi

          body="$(cat <<EOF
          Automatically generated from a push to \`main\` by GitHub Actions.

          - Repository: $REPOSITORY
          - Commit: https://github.com/$REPOSITORY/commit/$AFTER_SHA
          - Compare: https://github.com/$REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA
          - Classification: $kind

          **Changed files**
          $changed
          **Suggested next step:** $next_step

          This alert reports GitHub changes only; it does **not** mean ChatGPT has
          automatically reviewed the science or that a GPU experiment may run.
          EOF
          )"

          echo "## VLM push alert" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Commit: $short_sha" "- Category: $kind" "- Changed files: $total_files" >> "$GITHUB_STEP_SUMMARY"

          # Assignment subscribes the repository owner to the issue, so they
          # can receive GitHub inbox/email/mobile notifications per preferences.
          issue_url="$(gh issue create --repo "$REPOSITORY" --title "$title" --body "$body" --assignee "$NOTIFY_USER")"
          echo "- Notification issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Created notification: $issue_url"
\n'
          done
          if [[ -z "$changed" ]]; then
            changed="- No changed filenames returned by the GitHub API."$'\n'
          fi
          if (( total_files > 40 )); then
            changed+="- … and $(( total_files - 40 )) more files."$'\n'
          fi

          body="$(cat <<EOF
          Automatically generated from a push to \`main\` by GitHub Actions.

          - Repository: $REPOSITORY
          - Commit: https://github.com/$REPOSITORY/commit/$AFTER_SHA
          - Compare: https://github.com/$REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA
          - Classification: $kind

          **Changed files**
          $changed
          **Suggested next step:** $next_step

          This alert reports GitHub changes only; it does **not** mean ChatGPT has
          automatically reviewed the science or that a GPU experiment may run.
          EOF
          )"

          echo "## VLM push alert" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Commit: `$short_sha`" "- Category: $kind" "- Changed files: $total_files" >> "$GITHUB_STEP_SUMMARY"

          # Assignment subscribes the repository owner to the issue, so they
          # can receive GitHub inbox/email/mobile notifications per preferences.
          issue_url="$(gh issue create --repo "$REPOSITORY" --title "$title" --body "$body" --assignee "$NOTIFY_USER")"
          echo "- Notification issue: $issue_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Created notification: $issue_url"
